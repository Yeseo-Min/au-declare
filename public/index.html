<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#E2621B">
<meta name="description" content="호주 입국 시 신고할 음식·약품을 사진 한 장으로 영문 리스트로 만들어 주는 앱">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>호주 입국 신고 리스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: form-sheet app — orange Incoming Passenger Card accent, item rows like the paper list travellers print, a white A4 sheet for the officer */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#16202C; --muted:#5C6776; --line:#DCE1E7;
  --accent:#E2621B; --accent-ink:#FFFFFF; --accent-soft:#FDEBDD;
  --ok:#1E7A4C; --ok-soft:#E3F3EA; --warn:#9A6200; --warn-soft:#FBF0D9; --bad:#B8322A; --bad-soft:#FBE4E2;
  --shadow:0 1px 2px rgba(22,32,44,.06),0 8px 24px rgba(22,32,44,.06);
  --sheet-bg:#FFFFFF; --sheet-ink:#111418; --sheet-line:#2B3138; --sheet-muted:#59616B;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151B; --surface:#1A2029; --surface-2:#151A22; --ink:#E7EBF0; --muted:#9AA5B2; --line:#2B333E;
  --accent:#F07F3C; --accent-ink:#1A1007; --accent-soft:#3A2416;
  --ok:#5BC08A; --ok-soft:#173326; --warn:#E3B04F; --warn-soft:#3A2D12; --bad:#F07A70; --bad-soft:#3D1D1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151B; --surface:#1A2029; --surface-2:#151A22; --ink:#E7EBF0; --muted:#9AA5B2; --line:#2B333E;
  --accent:#F07F3C; --accent-ink:#1A1007; --accent-soft:#3A2416;
  --ok:#5BC08A; --ok-soft:#173326; --warn:#E3B04F; --warn-soft:#3A2D12; --bad:#F07A70; --bad-soft:#3D1D1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 64px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto}
.mono{font-family:var(--f-mono);letter-spacing:.04em}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:22px 14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .mark{width:40px;height:40px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px;flex:none}
.brand h1{font-size:20px;line-height:1.2;margin:0;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;padding-block:8px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] .n{color:inherit;opacity:.7}
.tab:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.ipc{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);margin-bottom:16px}
.ipc .q{font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
.ipc b{display:block;font-size:14px}
.ipc p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.yes{flex:none;display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;font-weight:600}
.yes i{width:18px;height:18px;border:2px solid var(--accent);border-radius:3px;display:grid;place-items:center;font-style:normal;color:var(--accent);font-size:13px;line-height:1}
.adder{padding:16px;display:grid;gap:12px;margin-bottom:16px}
.adder label.lbl{font-size:13px;color:var(--muted)}
.searchrow{display:flex;gap:8px;flex-wrap:wrap}
.search{position:relative;flex:1 1 260px;min-width:0}
.search input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:16px}
.search input:focus{border-color:var(--accent);outline:none}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;max-height:380px;overflow-y:auto}
.sg{display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.sg:hover,.sg.on{background:var(--surface-2)}
.sg img{width:40px;height:40px;border-radius:6px;border:1px solid var(--line);flex:none;background:#fff}
.sg .t{min-width:0;flex:1}
.sg .t b{display:block;font-weight:500}
.sg .t span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg.new .t b{color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.notice{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;color:var(--muted);margin-bottom:12px}
.list{display:grid;gap:10px}
.row{display:grid;grid-template-columns:96px minmax(0,1.2fr) minmax(0,1.5fr) auto;gap:14px;align-items:start;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.row .ph{width:96px;height:96px;border-radius:8px;border:1px solid var(--line);background:#fff;overflow:hidden;cursor:pointer;padding:0;display:block}
.row .ph img{width:100%;height:100%;object-fit:contain;display:block}
.nm{min-width:0}
.nm .ko{font-size:16px;font-weight:700;line-height:1.3}
.nm .en{font-size:14px;margin-top:2px}
.nm .cat{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
.dt{min-width:0;font-size:13px;color:var(--muted);display:grid;gap:4px}
.dt b{color:var(--ink);font-weight:500;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
.dt .tip{color:var(--ink);font-size:13px}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.pill{font-size:12px;font-weight:500;border-radius:999px;padding:3px 10px;white-space:nowrap;border:1px solid transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.tag{font-family:var(--f-mono);font-size:10px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted);margin-left:6px;vertical-align:2px}
.qty{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px}
@media (max-width:720px){
  .row{grid-template-columns:76px minmax(0,1fr);gap:10px}
  .row .ph{width:76px;height:76px}
  .row .dt{grid-column:1 / -1}
  .row .side{grid-column:1 / -1;flex-direction:row;justify-content:space-between;align-items:center}
}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,14,20,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:720px){.ov{align-items:center}}
.modal{background:var(--surface);border-radius:14px;width:min(760px,100%);max-height:calc(100% - 8px);overflow:auto;box-shadow:var(--shadow);border:1px solid var(--line)}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.mhead h2{font-size:16px;margin:0}
.mbody{padding:16px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px}
@media (max-width:720px){.mbody{grid-template-columns:1fr}}
.photo{display:grid;gap:10px;align-content:start}
.bigph{width:100%;max-width:240px;aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;justify-self:center}
.bigph img{width:100%;height:100%;object-fit:contain;display:block}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.opt{aspect-ratio:1;border:1.5px solid var(--line);border-radius:8px;background:#fff;padding:0;cursor:pointer;overflow:hidden}
.opt img{width:100%;height:100%;object-fit:contain;display:block}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.upl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.upl label{justify-content:center}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
.proc{display:grid;gap:6px;font-size:12px;color:var(--muted);padding:10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.proc .r{display:flex;align-items:center;justify-content:space-between;gap:8px}
.proc input[type=range]{width:100%;accent-color:var(--accent)}
.fields{display:grid;gap:10px;min-width:0}
.f{display:grid;gap:4px}
.f > span{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.f > span i{font-style:normal;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em}
.f input,.f textarea,.f select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.f textarea{resize:vertical;min-height:58px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.f2{grid-template-columns:1fr}}
.aibar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.aimsg{font-size:12px;color:var(--muted)}
.mfoot{display:flex;justify-content:space-between;gap:8px;padding:12px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
/* sheet tab */
.sheettools{display:grid;gap:12px;padding:16px;margin-bottom:16px}
.sheettools .f3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:720px){.sheettools .f3{grid-template-columns:1fr 1fr}}
.exp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sheetscroll{overflow-x:auto;padding-bottom:6px}
.sheet{background:var(--sheet-bg);color:var(--sheet-ink);width:794px;max-width:none;margin:0 auto 18px;padding:40px 40px 34px;border-radius:4px;box-shadow:var(--shadow);font-family:var(--f-body)}
.sheet h3{margin:0;font-size:22px;letter-spacing:.01em;font-family:var(--f-body)}
.sheet .sub{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12.5px;color:var(--sheet-muted);margin:6px 0 4px}
.sheet .sub b{color:var(--sheet-ink);font-weight:500}
.sheet .stmt{font-size:12.5px;margin:10px 0 14px;padding:8px 10px;border:1.5px solid var(--sheet-ink);border-radius:2px}
.sheet .stmt span{display:block;color:var(--sheet-muted);font-size:11.5px;margin-top:2px}
.sheet table{width:100%;border-collapse:collapse;table-layout:fixed}
.sheet th{font-size:11px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:6px 8px;border:1px solid var(--sheet-line);background:#EEF0F2;color:var(--sheet-ink)}
.sheet td{border:1px solid var(--sheet-line);padding:8px;vertical-align:middle;font-size:12.5px;line-height:1.4;color:var(--sheet-ink)}
.sheet td.p{width:112px;text-align:center}
.sheet td.p img{width:96px;height:96px;object-fit:contain;display:block;margin:0 auto}
.sheet .ien{font-size:15px;font-weight:700;line-height:1.25}
.sheet .ico{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--sheet-muted);margin-top:3px}
.sheet .iko{font-size:11.5px;color:var(--sheet-muted);margin-top:3px}
.sheet .lb{font-family:var(--f-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--sheet-muted)}
.sheet .num{text-align:center;font-family:var(--f-mono);font-size:12px}
.sheet .foot{margin-top:12px;font-size:10.5px;color:var(--sheet-muted);display:flex;justify-content:space-between;gap:10px}
.sheet .grp{display:flex;align-items:center;gap:8px;margin:14px 0 6px;font-size:14px}
.sheet .grp:first-of-type{margin-top:4px}
.sheet .grp .gn{width:22px;height:22px;border-radius:50%;background:var(--sheet-ink);color:var(--sheet-bg);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px}
.sheet .grp span:last-child{color:var(--sheet-muted);font-size:12px}
.lgrp{display:flex;align-items:baseline;gap:8px;margin:14px 0 2px;font-size:15px}
.lgrp b{font-weight:700}.lgrp span{color:var(--muted);font-size:12px;font-family:var(--f-mono)}
.sheet .none{padding:22px;text-align:center;color:var(--sheet-muted);border:1px dashed var(--sheet-line)}
.phr{padding:16px;display:grid;gap:8px}
.phr h4{margin:0 0 4px;font-size:15px}
.ph-i{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ph-i .t{min-width:0}
.ph-i .t b{display:block;font-weight:500}
.ph-i .t span{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:80;max-width:calc(100% - 32px);text-align:center}
.nm .br{font-size:12px;color:var(--muted);font-weight:500}
.phw{position:relative;width:96px;height:96px}
.phw .cam{position:absolute;right:-6px;bottom:-6px;width:32px;height:32px;border-radius:50%;border:2px solid var(--surface);background:var(--ink);color:var(--bg);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:var(--shadow)}
.phw .cam svg{width:16px;height:16px}
@media (max-width:720px){.phw{width:76px;height:76px}}
.nmh{display:flex;gap:6px;align-items:flex-start}
.pen{flex:none;width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--muted);margin-top:1px}
.pen:hover{color:var(--ink);border-color:var(--muted)}
.pen svg{width:14px;height:14px}
[data-ie]{border-radius:4px;cursor:text;touch-action:manipulation}
[data-ie]:hover{background:var(--surface-2)}
[data-ie][contenteditable="true"]{outline:2px solid var(--accent);background:var(--surface);padding:0 3px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface);overflow:hidden}
.step button{width:34px;height:32px;border:0;background:transparent;cursor:pointer;font-size:18px;line-height:1;color:var(--ink)}
.step button:hover{background:var(--surface-2)}
.step b{min-width:28px;text-align:center;font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums}
.unit{border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:6px 8px;font-size:13px}
.qtyrow{display:flex;gap:6px;align-items:center}
.xdel{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;padding:4px 6px;border-radius:6px;white-space:nowrap}
.xdel:hover{color:var(--bad);background:var(--bad-soft)}
.bulk{display:grid;gap:10px;padding:14px;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface-2)}
.bulk textarea{width:100%;min-height:96px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);resize:vertical;font-size:15px}
.ways{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:720px){.ways{grid-template-columns:1fr}}
.way{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;cursor:pointer;min-width:0}
.way:hover{border-color:var(--accent)}
.way.main{border-color:var(--accent);background:var(--accent-soft)}
.way .ico{flex:none;width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.way.main .ico{background:var(--accent);color:var(--accent-ink)}
.way .ico svg{width:18px;height:18px}
.way b{display:block;font-size:14px}
.way span{display:block;font-size:12px;color:var(--muted);line-height:1.45}
.busy{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:14px}
.toast button{border:0;background:transparent;color:inherit;text-decoration:underline;font-weight:700;margin-left:10px;cursor:pointer}
.camrow{display:flex;gap:6px}
.sg .t b small{font-weight:400;color:var(--muted);margin-right:4px}
.shoot{font-size:12px;color:var(--muted);line-height:1.5}
/* incoming passenger card sample */
.cardform{padding:16px;display:grid;gap:14px;margin-bottom:16px}
.cardform h3{margin:0;font-size:15px}
.cardform .g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:720px){.cardform .g{grid-template-columns:1fr 1fr}}
@media (max-width:440px){.cardform .g{grid-template-columns:1fr}}
.cardform .f input,.cardform .f textarea{text-transform:uppercase}
.cardform .f.wide{grid-column:1/-1}
.cardform .f textarea{resize:vertical;min-height:52px;line-height:1.4}
.act .f textarea{background:var(--surface);border:2px solid var(--act-line)}
.cardform .f input.nu{text-transform:none}
.qlist{display:grid;gap:0;border-top:1px solid var(--line)}
.qi{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.qi .no{font-family:var(--f-mono);font-weight:600;color:var(--muted)}

const IS_APP=typeof makeApi==='function';
const IDB=(()=>{let dbp=null;
  const open=()=>dbp||(dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('au-declare',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}));
  const tx=async(mode,fn)=>{const db=await open();return new Promise((res,rej)=>{const t=db.transaction('kv',mode);const req=fn(t.objectStore('kv'));t.oncomplete=()=>res(req?req.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})};
  return {get:k=>tx('readonly',s=>s.get(k)),set:(k,v)=>tx('readwrite',s=>s.put(v,k)),del:k=>tx('readwrite',s=>s.delete(k)),keys:()=>tx('readonly',s=>s.getAllKeys())};
})();
let IDB_OK=false, META=null;
const ORIGC=new Map();
const ORIG={has:k=>ORIGC.has(k),get:k=>ORIGC.get(k),
  set:(k,v)=>{ORIGC.set(k,v);if(IDB_OK)IDB.set('img:'+k,v).catch(()=>{})},
  delete:k=>{ORIGC.delete(k);if(IDB_OK)IDB.del('img:'+k).catch(()=>{})}};
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(saveNow,250)}
async function saveNow(){clearTimeout(saveT);
  if(IDB_OK&&META){try{await IDB.set('trip:'+META.current,S);const t=META.trips.find(x=>x.id===META.current);if(t){t.updated=Date.now();t.n=S.food.length+S.med.length}await IDB.set('meta',META);return}catch(e){}}
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('저장 공간이 부족해 마지막 변경이 저장되지 않았어요')}}
function tripName(){return META?.trips.find(t=>t.id===META.current)?.name||'호주 여행'}
function blankTrip(from){const c=from?.card||{};const keep={};['surname','given','nat','dob','phone','email','emName','emContact','occ','boarded','res'].forEach(k=>{if(c[k])keep[k]=c[k]});
  return {food:[],med:[],trav:{name:from?.trav?.name||'',flight:'',date:'',port:''},card:keep}}
function fixState(){S.food=S.food||[];S.med=S.med||[];S.food.forEach(normItem);S.med.forEach(normItem);S.trav=S.trav||{name:'',flight:'',date:'',port:''};S.card={...CARD0,...(S.card||{})}}
async function preloadImgs(){if(!IDB_OK)return;for(const it of [...S.food,...S.med]){if(!ORIGC.has(it.id)){try{const v=await IDB.get('img:'+it.id);if(v)ORIGC.set(it.id,v)}catch(e){}}}}
async function boot(){
  try{await IDB.keys();IDB_OK=true}catch(e){IDB_OK=false}
  if(IDB_OK){try{
    META=await IDB.get('meta');
    if(!META){const id=uid();META={current:id,trips:[{id,name:'호주 여행',updated:Date.now(),n:S.food.length+S.med.length}],cfg:{saveShots:IS_APP}};await IDB.set('trip:'+id,S);await IDB.set('meta',META)}
    else{const d=await IDB.get('trip:'+META.current);if(d&&d.food)S=d}
    META.cfg=META.cfg||{saveShots:IS_APP};
  }catch(e){IDB_OK=false}}
  fixState();await preloadImgs();render();
}
async function switchTrip(id){await saveNow();META.current=id;const d=await IDB.get('trip:'+id);S=d&&d.food?d:blankTrip();fixState();await preloadImgs();await IDB.set('meta',META);render();toast(`'${tripName()}' 목록을 열었어요`)}
async function newTrip(copy){await saveNow();const id=uid();let data,name;
  if(copy){data=JSON.parse(JSON.stringify(S));const re=it=>{const nid=uid();if(ORIGC.has(it.id))ORIG.set(nid,ORIGC.get(it.id));return {...it,id:nid,sample:false}};data.food=data.food.map(re);data.med=data.med.map(re);name=tripName()+' 복사본'}
  else{data=blankTrip(S);name='새 호주 여행'}
  await IDB.set('trip:'+id,data);META.trips.unshift({id,name,updated:Date.now(),n:data.food.length+data.med.length});await switchTrip(id);openTrips(true)}
async function deleteTrip(id){if(META.trips.length<2)return toast('마지막 여행은 지울 수 없어요');
  try{const d=await IDB.get('trip:'+id);if(d)for(const it of [...(d.food||[]),...(d.med||[])])IDB.del('img:'+it.id).catch(()=>{})}catch(e){}
  await IDB.del('trip:'+id);META.trips=META.trips.filter(t=>t.id!==id);if(META.current===id){META.current=META.trips[0].id;await switchTrip(META.current)}else await IDB.set('meta',META);openTrips(true)}

async function exportTrips(all){
  await saveNow();const out=[];
  const list=IDB_OK&&META?(all?META.trips:META.trips.filter(t=>t.id===META.current)):[{id:null,name:'호주 여행'}];
  for(const t of list){const data=!t.id||t.id===META?.current?S:await IDB.get('trip:'+t.id);if(!data)continue;const imgs={};
    for(const it of [...data.food,...data.med]){let v=ORIGC.get(it.id);if(!v&&IDB_OK){try{v=await IDB.get('img:'+it.id)}catch(e){}}if(v)imgs[it.id]=v}
    out.push({name:t.name,data,imgs})}
  const json=JSON.stringify({app:'au-declare',v:1,exported:new Date().toISOString(),trips:out});
  const nm=(all?'전체여행':out[0]?.name||'여행').replace(/[\\/:*?"<>|]/g,'').trim();
  if(!DL)return toast('이 화면에서는 파일 저장을 쓸 수 없어요');
  try{const d0=new Date(),pd=n=>String(n).padStart(2,'0');await DL.save({filename:`AU-declare-${all?'all':'trip'}-${d0.getFullYear()}${pd(d0.getMonth()+1)}${pd(d0.getDate())}.json`,data:new Blob([json],{type:'application/json'})});toast('백업 파일을 만들었어요. 카톡이나 드라이브에 보관하세요')}
  catch(e){if(e?.code!=='declined')toast('백업 파일을 만들지 못했어요')}}
async function importFile(f){
  let j;try{j=JSON.parse(await f.text())}catch(e){return toast('백업 파일을 읽지 못했어요')}
  if(!j||j.app!=='au-declare'||!Array.isArray(j.trips)||!j.trips.length)return toast('이 앱의 백업 파일이 아니에요');
  let first=null;
  for(const t of j.trips){const data=t.data||{};const re=it=>{const nid=uid();const v=t.imgs&&t.imgs[it.id];if(v)ORIG.set(nid,v);return {...it,id:nid}};
    data.food=(data.food||[]).map(re);data.med=(data.med||[]).map(re);
    if(IDB_OK){const id=uid();await IDB.set('trip:'+id,data);META.trips.unshift({id,name:(t.name||'호주 여행')+' (불러옴)',updated:Date.now(),n:data.food.length+data.med.length});first=first||id}
    else{S=data;fixState();save();render();return toast('백업을 불러왔어요')}}
  await IDB.set('meta',META);await switchTrip(first);toast(`여행 ${j.trips.length}개를 불러왔어요`)}

function search(q,kind){
  const n=norm(q);if(!n)return[];
  const toks=String(q).toLowerCase().split(/\s+/).filter(Boolean);
  const sc=e=>{const k=norm(e.k),b=norm(e.b),full=b+k,hay=norm([e.b,e.k,...e.a,e.en].join(' '));
    let s=0;
    if(full===n||k===n)s=100;else if(k.startsWith(n)||full.startsWith(n))s=85;else if(k.includes(n)||full.includes(n))s=72;
    else if(e.a.some(a=>norm(a)===n))s=e.brand?58:90;else if(e.a.some(a=>norm(a).includes(n)))s=e.brand?50:60;
    else if(toks.length>1&&toks.every(t=>hay.includes(t)))s=78;
    else if(norm(e.en).includes(n))s=40;else if(n.length>1&&n.includes(k))s=55;
    if(s&&b&&n.includes(b))s+=6;if(s&&e.brand)s+=1;return s};
  return D[kind].map(e=>[sc(e),e]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,12).map(x=>x[1]);
}

function bindAdder(kind){
  const q=document.getElementById('q'),sg=document.getElementById('sugg');let sel=0;
  const draw=()=>{const v=q.value.trim();if(!v){sg.hidden=true;return}
    const res=search(v,kind);const more=MORE.q===v&&MORE.kind===kind?MORE.list:[];
    const all=[...res,...more.filter(m=>!res.some(r=>norm(r.b+r.k)===norm(m.b+m.k)))];
    let html=all.map((e,i)=>{const [l]=ST[kind][e.st]||['',''];return `<button class="sg ${i===sel?'on':''}" data-pick="${e.uid}"><img alt="" src="${svgURL(e.ic[0])}"><span class="t"><b>${e.b&&!e.k.includes(e.b)?`<small>${esc(e.b)}</small>`:''}${esc(e.k)}${e.ai?'<span class="tag">Claude</span>':''}</b><span>${esc(e.en)} · ${l}</span></span></button>`}).join('');
    if(SAMPLE&&!(MORE.q===v&&MORE.kind===kind&&!MORE.loading&&more.length))html+=`<button class="sg new" data-more="1"><img alt="" src="${svgURL(kind==='food'?'snack':'box')}"><span class="t"><b>${MORE.loading&&MORE.q===v?'<span class="spin"></span> 찾는 중…':`"${esc(v)}" 다른 제품 더 찾기`}</b><span>Claude가 맛·용량·종류별 시판 제품을 찾아 영문 정보까지 채워요</span></span></button>`;
    html+=`<button class="sg new" data-new="1"><img alt="" src="${svgURL(kind==='food'?'pack':'box')}"><span class="t"><b>"${esc(v)}" 이름 그대로 추가</b><span>${SAMPLE?'영문명·성분은 Claude가 자동으로 써요':'영문 정보는 직접 입력해요'}</span></span></button>`;
    sg.innerHTML=html;sg.hidden=false};
  q.addEventListener('input',()=>{sel=0;draw()});
  q.addEventListener('keydown',e=>{const n=sg.querySelectorAll('.sg').length;if(e.key==='ArrowDown'){sel=Math.min(n-1,sel+1);draw();e.preventDefault()}else if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);draw();e.preventDefault()}else if(e.key==='Enter'){e.preventDefault();const b=sg.querySelectorAll('.sg')[sel];b&&b.click()}else if(e.key==='Escape'){sg.hidden=true}});
  q.addEventListener('blur',()=>setTimeout(()=>{sg.hidden=true},200));
  q.addEventListener('focus',()=>{if(q.value.trim())draw()});
  sg.addEventListener('mousedown',e=>e.preventDefault());
  sg.addEventListener('click',async e=>{const b=e.target.closest('.sg');if(!b)return;
    if(b.dataset.pick){addDict(b.dataset.pick);q.value='';sg.hidden=true}
    else if(b.dataset.more){const p=findMore(q.value.trim(),kind);draw();await p;if(q.isConnected&&q.value.trim())draw()}
    else{addNew(q.value.trim(),kind);q.value='';sg.hidden=true}});
  const ta=document.getElementById('bulkText');if(ta)ta.addEventListener('input',()=>{S.bulkDraft=ta.value;save()});
  document.getElementById('grpCam').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f){maybeSaveShot(f);analyzePhoto(f,'photo')}});
  document.getElementById('albMulti').addEventListener('change',e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)addAlbum(fs,kind)});
}

function tolerantJSON(t){if(!t)return null;try{return JSON.parse(t)}catch(_){}
  const m=String(t).match(/\{[\s\S]*\}/);if(m){try{return JSON.parse(m[0])}catch(_){}}
  /* cut-off reply: keep complete objects inside "items":[ ... */
  const k=String(t).indexOf('[');if(k<0)return null;const body=t.slice(k+1);const objs=[];let depth=0,st=-1,inStr=false,esc2=false;
  for(let i=0;i<body.length;i++){const ch=body[i];if(inStr){if(esc2)esc2=false;else if(ch==='\\')esc2=true;else if(ch==='"')inStr=false;continue}
    if(ch==='"')inStr=true;else if(ch==='{'){if(!depth)st=i;depth++}else if(ch==='}'){depth--;if(!depth&&st>=0){try{objs.push(JSON.parse(body.slice(st,i+1)))}catch(_){}st=-1}}}
  return objs.length?{items:objs}:null}
function dictMatch(b,k){const q=((b||'')+' '+(k||'')).trim();if(!q)return null;
  let best=null,bs=0;for(const kind of ['food','med'])for(const e of search(q,kind).slice(0,3)){const s2=norm(e.b+e.k)===norm(q)||norm(e.k)===norm(k)?100:norm(e.b+e.k).includes(norm(k))?80:0;if(s2>bs){bs=s2;best=e}}
  return bs>=80?best:null}

async function snap(kind,withBreaks){const el=document.getElementById('sheet-'+kind);const t=el.style.transform;el.style.transform='none';
  /* drawn icons are SVG; turn them into PNG so they show up in the saved file */
  const svgs=[...el.querySelectorAll('img')].filter(i=>i.src.startsWith('data:image/svg'));const olds=svgs.map(i=>i.src);
  for(const i of svgs){try{const im=await loadImg(i.src);const c=document.createElement('canvas');c.width=c.height=240;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,240,240);x.drawImage(im,0,0,240,240);i.src=c.toDataURL('image/png');await i.decode().catch(()=>{})}catch(e){}}
  try{const c=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});if(!withBreaks)return c;
    /* safe places to cut a page: below each table row / group heading */
    const top=el.getBoundingClientRect().top,k=c.width/el.offsetWidth;
    const br=[...el.querySelectorAll('tr,.grp,.stmt,.sub,h3')].map(n=>Math.round((n.getBoundingClientRect().bottom-top)*k)).filter(v=>v>0).sort((a,b)=>a-b);
    const starts=[...el.querySelectorAll('.grp')].map(n=>Math.round((n.getBoundingClientRect().top-top)*k));
    return {c,br:[...new Set([...br,...starts])].sort((a,b)=>a-b)}}
  finally{el.style.transform=t;svgs.forEach((i,n)=>i.src=olds[n])}}
async function exportSheet(what){
  const msg=document.getElementById('expmsg');msg.innerHTML='<span class="spin"></span> 만드는 중…';
  try{
    let blob,name;
    if(what==='pdf'){
      const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4'});try{pdf.setDisplayMode('fullwidth','continuous')}catch(_){}const PW=210,PH=297,M=10,CW=PW-2*M,CH=PH-2*M;let first=true;
      for(const k of ['food','med']){const {c,br}=await snap(k,true);const pxPerMm=c.width/CW;const pageH=Math.floor(CH*pxPerMm);
        let y=0;while(y<c.height-2){let end=y+pageH;
          if(end<c.height){const cut=br.filter(v=>v>y+pageH*.25&&v<=end).pop();end=cut||end}else end=c.height;
          const h=end-y;const s=document.createElement('canvas');s.width=c.width;s.height=h;const sx=s.getContext('2d');sx.fillStyle='#fff';sx.fillRect(0,0,s.width,h);sx.drawImage(c,0,y,c.width,h,0,0,c.width,h);
          if(!first)pdf.addPage();first=false;pdf.addImage(s.toDataURL('image/jpeg',.92),'JPEG',M,M,CW,h/pxPerMm);y=end}}
      blob=pdf.output('blob');name='australia-declaration-list.pdf';
    }else{const c=await snap(what);blob=await new Promise(r=>c.toBlob(r,'image/png'));name=`australia-declaration-${what}.png`}
    await DL.save({filename:name,data:blob});msg.textContent='저장했어요';
  }catch(e){msg.textContent=e?.code==='declined'?'저장을 취소했어요':(e?.code==='unavailable'||e?.code==='not_granted')?'이 화면에서는 파일 저장을 쓸 수 없어요':'저장에 실패했어요. 다시 시도해 주세요'}
}

function refreshCard(){const f=document.getElementById('fitF'),b=document.getElementById('fitB');if(!f)return;f.innerHTML=cardFront();b.innerHTML=cardBack();fitCards()}
function fitSheets(){document.querySelectorAll('.sheetfit').forEach(w=>{const c=w.firstElementChild;if(!c)return;c.style.transform='none';const s=Math.min(1,w.clientWidth/c.offsetWidth);c.style.transform=`scale(${s})`;w.style.height=Math.ceil(c.offsetHeight*s)+'px'})}
function fitCards(){document.querySelectorAll('.ipfit').forEach(w=>{const c=w.firstElementChild;if(!c)return;c.style.transform='none';const s=Math.min(1,w.clientWidth/960);c.style.transform=`scale(${s})`;w.style.height=Math.ceil(c.offsetHeight*s)+'px'})}
addEventListener('resize',()=>{if(TAB==='card')fitCards();if(TAB==='sheet')fitSheets()});
function bindCard(){
  document.querySelectorAll('[data-c]').forEach(el=>{const k=el.dataset.c;const h=()=>{const v=el.classList.contains('nu')||el.tagName==='SELECT'||el.type==='date'?el.value:el.value.toUpperCase();S.card[k]=v;save();refreshCard()};el.addEventListener('input',h);el.addEventListener('change',h)});
  const os=document.getElementById('c-occsel');if(os)os.addEventListener('change',()=>{if(os.value==='__'){S.card._occCustom=true;S.card.occ='';save();render()}else{S.card._occCustom=false;S.card.occ=os.value;save();render()}});
}
async function saveCard(){
  const msg=document.getElementById('cardmsg');msg.innerHTML='<span class="spin"></span> 만드는 중…';
  try{const els=[document.getElementById('ipFront'),document.getElementById('ipBack')];const cs=[];
    for(const el of els){const t=el.style.transform;el.style.transform='none';cs.push(await html2canvas(el,{scale:2,backgroundColor:'#FBF0D6',logging:false}));el.style.transform=t}
    const out=document.createElement('canvas');out.width=Math.max(...cs.map(c=>c.width));out.height=cs.reduce((a,c)=>a+c.height,0)+40;const o=out.getContext('2d');o.fillStyle='#ffffff';o.fillRect(0,0,out.width,out.height);
    let y=0;cs.forEach(c=>{o.drawImage(c,0,y);y+=c.height+40});
    const blob=await new Promise(r=>out.toBlob(r,'image/png'));await DL.save({filename:'australia-passenger-card-sample.png',data:blob});msg.textContent='저장했어요';
  }catch(e){msg.textContent=e?.code==='declined'?'저장을 취소했어요':'저장에 실패했어요. 다시 시도해 주세요'}
}

/* ---------- global events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){TAB=t.dataset.tab;try{localStorage.setItem(KEY+'-tab',TAB)}catch(_){}render();window.scrollTo({top:0});return}
  const pb=e.target.closest('[data-pedit]');if(pb){const it=getIt(pb.dataset.pedit);if(it&&(it.photo||ORIG.has(it.id)))openPhotoEditor(it.id);else openEdit(pb.dataset.pedit);return}
  if(e.target.closest('[data-trips]')){openTrips();return}
  const dyb=e.target.closest('[data-days]');if(dyb){const it=getIt(dyb.dataset.days);it.days=String(tripDays());it.sample=false;save();render();toast(`${tripDays()}일분으로 적었어요. 내용물 개수도 맞춰 주세요`);return}
  const mvb=e.target.closest('[data-mv]');if(mvb){const it=getIt(mvb.dataset.mid);const arr=S[it.kind];
    const vis=it.kind==='med'&&S.medSplit?MGRP.flatMap(([g])=>arr.filter(x=>medGroup(x)===g)):arr.slice();
    const i=vis.indexOf(it),j=i+(+mvb.dataset.mv);if(j<0||j>=vis.length)return;const other=vis[j];
    if(it.kind==='med'&&S.medSplit&&medGroup(other)!==medGroup(it))return toast('묶음이 다른 약이에요. 묶음 버튼으로 옮겨 주세요');
    const a=arr.indexOf(it),b=arr.indexOf(other);arr[a]=other;arr[b]=it;it.sample=false;save();render();
    const el=document.querySelector(`.row[data-id="${it.id}"]`);if(el){el.scrollIntoView({block:'center'});el.classList.add('moved');setTimeout(()=>el.classList.remove('moved'),600)}return}
  const spb=e.target.closest('[data-split] button');if(spb){S.medSplit=spb.dataset.v==='1';save();render();return}
  const gsb=e.target.closest('[data-gsel] button');if(gsb){const it=getIt(gsb.closest('[data-gsel]').dataset.gsel);it.grp=gsb.dataset.g;it.sample=false;save();render();return}
  const nb=e.target.closest('[data-name]');if(nb){openEdit(nb.dataset.name);return}
  const ed=e.target.closest('[data-edit]');if(ed){openEdit(ed.dataset.edit);return}
  const ad=e.target.closest('[data-add]');if(ad){addDict(ad.dataset.add);return}
  if(e.target.closest('[data-clear-sample]')){S[TAB]=S[TAB].filter(i=>!i.sample);save();render();return}
  const ex=e.target.closest('[data-exp]');if(ex){exportSheet(ex.dataset.exp);return}
  const inc=e.target.closest('[data-inc],[data-dec]');if(inc){const it=getIt(inc.dataset.inc||inc.dataset.dec);it.n=Math.max(1,(+it.n||1)+(inc.dataset.inc?1:-1));it.sample=false;save();inc.parentElement.querySelector('b').textContent=it.n;return}
  const dl=e.target.closest('[data-del]');if(dl&&!dl.closest('.modal')){const it=getIt(dl.dataset.del);const arr=S[it.kind],idx=arr.indexOf(it);arr.splice(idx,1);save();render();toast(`${it.ko} 삭제됨`,{label:'되돌리기',fn:()=>{arr.splice(idx,0,it);save();render()}});return}
  if(e.target.closest('[data-pcsave]')){try{localStorage.setItem('au-declare-pass',document.getElementById('pcIn').value.trim())}catch(_){}LASTERR=null;render();toast('저장했어요. 다시 시도해 주세요');return}
  if(e.target.closest('[data-diag]')){runDiag();return}
  if(e.target.closest('[data-diagx]')){DIAG=null;render();return}
  if(e.target.closest('[data-errx]')){LASTERR=null;render();return}
  if(e.target.closest('[data-bulkgo]')){bulkAdd();return}
  if(e.target.closest('[data-bulk]')){BULK=!BULK;render();if(BULK)setTimeout(()=>document.getElementById('bulkText')?.focus(),0);return}
  if(e.target.closest('[data-stop]')){BUSYCTL?.abort();BUSY=null;render();return}
  const sh=e.target.closest('[data-shoot]');if(sh){shootFor(sh.dataset.shoot);return}
  if(e.target.closest('[data-pickgrp]')){choosePhoto('여러 제품 한 번에 넣기',(f,cam)=>{if(cam)maybeSaveShot(f);analyzePhoto(f,'photo')});return}
  const sgb=e.target.closest('[data-seg] button');if(sgb){const k=sgb.closest('[data-seg]').dataset.seg,v=sgb.dataset.v;
    if(k[0]==='q'&&/^q\d+$/.test(k)){const n=+k.slice(1);const auto=autoQ()[n]?'yes':'no';if(v===auto)delete S.card.q[n];else S.card.q[n]=v}else S.card[k]=v;save();render();return}
  const qr=e.target.closest('[data-qreset]');if(qr){delete S.card.q[qr.dataset.qreset];save();render();return}
  if(e.target.closest('[data-cardsave]')){saveCard();return}
  const cp=e.target.closest('[data-copy]');if(cp){const txt=PHR[+cp.dataset.copy][0];
    try{navigator.clipboard.writeText(txt).then(()=>toast('복사했어요'),()=>selectText(cp))}catch(_){selectText(cp)}return}
});
document.addEventListener('change',e=>{const ds=e.target.closest('[data-dsel]');if(ds){const it=getIt(ds.dataset.dsel);it.days=ds.value;it.sample=false;save();return}const rx=e.target.closest('[data-rxt]');if(rx){const it=getIt(rx.dataset.rxt);it.rx=rx.checked;it.sample=false;save();return}const u=e.target.closest('[data-unit]');if(u){const it=getIt(u.dataset.unit);it.u=u.value;it.sample=false;save()}});
document.addEventListener('dblclick',e=>{const el=e.target.closest('[data-ie]');if(!el||el.isContentEditable)return;const it=getIt(el.dataset.id);if(!it)return;const f=el.dataset.ie;
  if(f==='ko'){openEdit(it.id);setTimeout(()=>{const k=document.getElementById('e-ko');if(k){k.focus();k.select()}},60);return}
  el.textContent=it[f]||'';el.contentEditable='true';el.focus();const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);let done=false;
  const fin=keep=>{if(done)return;done=true;el.contentEditable='false';if(keep){it[f]=el.textContent.replace(/\s+/g,' ').trim();if(f==='days')it.days=(it.days.match(/\d+/)||[''])[0];it.sample=false;save()}render()};
  el.addEventListener('blur',()=>fin(true),{once:true});
  el.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();el.blur()}else if(ev.key==='Escape'){ev.preventDefault();done=false;fin(false)}});
});
let lastTap={el:null,t:0};
document.addEventListener('touchend',e=>{const el=e.target.closest('[data-ie]');if(!el||el.isContentEditable)return;const now=Date.now();
  if(lastTap.el===el&&now-lastTap.t<380){e.preventDefault();lastTap={el:null,t:0};el.dispatchEvent(new MouseEvent('dblclick',{bubbles:true}))}else lastTap={el,t:now}},{passive:false});
function selectText(btn){const b=btn.parentElement.querySelector('b');const r=document.createRange();r.selectNodeContents(b);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('선택됐어요. 길게 눌러 복사하세요')}
let tT;function toast(m,act){const r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast" role="status">${esc(m)}${act?`<button id="tact">${esc(act.label)}</button>`:''}</div>`;if(act)document.getElementById('tact').onclick=()=>{r.innerHTML='';act.fn()};clearTimeout(tT);tT=setTimeout(()=>r.innerHTML='',act?5000:2600)}
document.getElementById('rowcam').addEventListener('change',async e=>{const f=e.target.files[0];const it=getIt(CAMT);if(!f||!it)return;maybeSaveShot(f);delete it.pe;
  toast('배경을 하얗게 정리하는 중…');TOLS.delete(it.id);ROTS.delete(it.id);
  const o=await downscale(await fileToURL(f));ORIG.set(it.id,o);it.photo=await whiten(o,TOL0,true);it.sample=false;save();render();
  toast('흰 배경 사진으로 바꿨어요. 사진을 누르면 크기·각도를 조절할 수 있어요')});
try{const t=localStorage.getItem(KEY+'-tab');if(['food','med','sheet','card'].includes(t))TAB=t}catch(e){}
(function(){const vv=window.visualViewport;const R=document.documentElement;
  const set=()=>{R.style.setProperty('--vvh',(vv?vv.height:innerHeight)+'px');R.style.setProperty('--vvt',(vv?vv.offsetTop:0)+'px')};
  if(vv){vv.addEventListener('resize',set);vv.addEventListener('scroll',set)}addEventListener('resize',set);set();
  document.addEventListener('focusin',e=>{const el=e.target;if(!el.matches||!el.matches('input:not([type=checkbox]):not([type=range]):not([type=file]),textarea,[contenteditable="true"]'))return;
    const go=()=>{if(el.id==='q'){const r=el.getBoundingClientRect();window.scrollBy({top:r.top-64,behavior:'smooth'})}else el.scrollIntoView({block:'center',behavior:'smooth'})};
    setTimeout(go,120);setTimeout(go,450)});
})();
boot();
</script>
